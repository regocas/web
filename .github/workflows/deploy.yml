name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # No custom domain configured yet (no CNAME file at the repo root) means
      # GitHub Pages serves this project site from /<repo-name>/ instead of
      # the domain root, so every internal link needs that prefix. Once a
      # CNAME file is added, this switches to "/" automatically and paths
      # resolve at the domain root instead.
      - name: Determine path prefix
        run: |
          if [ -f CNAME ]; then
            echo "PATH_PREFIX=/" >> "$GITHUB_ENV"
          else
            echo "PATH_PREFIX=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      - run: npm run build
        env:
          PATH_PREFIX: ${{ env.PATH_PREFIX }}

      # Branch-based Pages runs Jekyll unless told not to, and Jekyll drops
      # files starting with "_". The custom domain must also live in the
      # published branch, or each deploy would detach it.
      - name: Prepare output for Pages
        run: |
          touch _site/.nojekyll
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi

      # Publishes to the gh-pages branch, which Pages serves. PR previews
      # (see preview.yml) live in its pr-preview/ folder, so leave it alone.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

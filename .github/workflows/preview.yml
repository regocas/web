name: Deploy PR preview

# Builds each pull request into gh-pages under pr-preview/pr-<number>/,
# comments the preview link on the PR, and removes it when the PR closes.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # PRs from forks get a read-only token and can't push to gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: github.event.action != 'closed'

      # Same logic as deploy.yml, plus the preview subfolder.
      - name: Determine path prefix
        if: github.event.action != 'closed'
        run: |
          dir="pr-preview/pr-${{ github.event.number }}/"
          if [ -f CNAME ]; then
            echo "PATH_PREFIX=/$dir" >> "$GITHUB_ENV"
          else
            echo "PATH_PREFIX=/${{ github.event.repository.name }}/$dir" >> "$GITHUB_ENV"
          fi

      - run: npm run build
        if: github.event.action != 'closed'
        env:
          PATH_PREFIX: ${{ env.PATH_PREFIX }}

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
